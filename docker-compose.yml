version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: florasense-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-flora_root_secure_2026}
      MYSQL_DATABASE: florasense_db
      MYSQL_USER: ${DB_USER:-flora_app_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-flora_secure_pass_483}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: florasense-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "8883:8883"
    volumes:
      - ./backend/mosquitto/config:/mosquitto/config
      - ./backend/mosquitto/data:/mosquitto/data
      - ./backend/mosquitto/log:/mosquitto/log

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: florasense-api
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: florasense_db
      DB_USER: ${DB_USER:-flora_app_user}
      DB_PASS: ${DB_PASSWORD:-flora_secure_pass_483}
      MQTT_BROKER_URL: mqtts://mosquitto:8883
      JWT_SECRET: ${JWT_SECRET:-florasense_super_secret_jwt_key_2026}
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
      mosquitto:
        condition: service_started

volumes:
  mysql_data:
